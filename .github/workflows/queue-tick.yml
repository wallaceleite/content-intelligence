name: Tick da fila do Publicador
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Processa fila de publicacoes
        run: |
          curl -fsS -m 280 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://content-intelligence-infolauncher.vercel.app/api/publish/run"
